# Single-package repo: declare the root explicitly. pnpm and `actions/setup-node`'s
# `cache: pnpm` both error with "packages field missing or empty" without it.
packages:
  - '.'

# pnpm does not run a dependency's install scripts unless it is approved here,
# and pnpm 11 makes an unapproved script a hard `ERR_PNPM_IGNORED_BUILDS`
# failure rather than a warning — so `pnpm install` exits 1 without this block.
# (pnpm 11 spells it `allowBuilds:`; pnpm 10 spelled it `onlyBuiltDependencies:`
# and only warned. The toolchain here is pinned to 11 — see flake.nix.)
#
#   esbuild — its `postinstall` resolves and stamps the platform-native binary
#     that `vite build` shells out to. Modern esbuild also ships that binary as
#     an optionalDependency, so the build happens to succeed even when the
#     script is skipped (npm's own `npm ci` skipped it here and still built);
#     the entry exists so the INSTALL succeeds, and so the sanctioned path runs.
#
# This file ships in the submitted bundle. `.github/` does not — so a build that
# only ever ran in CI could never have caught a missing entry here.
allowBuilds:
  esbuild: true

# 🔴 A DELIBERATE, NARROW EXEMPTION FROM A SUPPLY-CHAIN CONTROL. READ BEFORE EXTENDING.
#
# pnpm 11 enforces a `minimumReleaseAge` (24h by default): a lockfile entry for a
# package published within that window is REFUSED. That control exists to blunt
# third-party supply-chain attacks — a compromised maintainer account publishing a
# malicious version — by giving the ecosystem time to detect and yank it.
#
# `@civitai/sdk@0.2.0` is FIRST-PARTY: published from this org's own
# `civitai-app-starters` monorepo (2026-09-23T03:49:30Z), by hand, because npm OIDC
# trusted publishing cannot create a package that does not exist yet. The threat the
# waiting period guards against — someone else's compromised release — does not apply
# to a version we cut ourselves. Same decision, same package, as `civitai-app-requests`,
# the first fleet app ported off the bridge.
#
# 🔴 IT IS PINNED TO THE EXACT VERSION ON PURPOSE. A bare `@civitai/sdk` would exempt
# EVERY FUTURE RELEASE of the package, forever and silently — including one cut by
# someone else, or by a compromised token.
#
# 🔴 THE POLICY IS NOT DISABLED AND MUST NOT BE. It still runs and still verifies every
# other lockfile entry; exactly one is exempt. Do NOT "fix" a future violation by
# setting `minimumReleaseAge: 0` or by dropping the version pin — that removes the
# protection for every dependency.
#
# REMOVE THIS ENTRY once `@civitai/sdk` moves past 0.2.0. It is then dead config that
# silently weakens the next reader's assumptions.
minimumReleaseAgeExclude:
  - '@civitai/sdk@0.2.0'
