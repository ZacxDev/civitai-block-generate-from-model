# Single-package repo: declare the root explicitly. pnpm and `actions/setup-node`'s
# `cache: pnpm` both error with "packages field missing or empty" without it.
packages:
  - '.'

# pnpm does not run a dependency's install scripts unless it is approved here,
# and pnpm 11 makes an unapproved script a hard `ERR_PNPM_IGNORED_BUILDS`
# failure rather than a warning — so `pnpm install` exits 1 without this block.
# (pnpm 11 spells it `allowBuilds:`; pnpm 10 spelled it `onlyBuiltDependencies:`
# and only warned. The toolchain here is pinned to 11 — see flake.nix.)
#
#   esbuild — its `postinstall` resolves and stamps the platform-native binary
#     that `vite build` shells out to. Modern esbuild also ships that binary as
#     an optionalDependency, so the build happens to succeed even when the
#     script is skipped (npm's own `npm ci` skipped it here and still built);
#     the entry exists so the INSTALL succeeds, and so the sanctioned path runs.
#
# This file ships in the submitted bundle. `.github/` does not — so a build that
# only ever ran in CI could never have caught a missing entry here.
allowBuilds:
  esbuild: true

# There is deliberately no `minimumReleaseAgeExclude` block here. pnpm 11's 24h
# supply-chain waiting period applies to every entry in the lockfile, `@civitai/sdk`
# included, and `pnpm install --frozen-lockfile` passes under it unmodified.
#
# An earlier revision of this file carried an exemption for `@civitai/sdk@0.2.0` that
# never had any effect: 0.2.0 was published 2026-09-23T03:49:30Z, so its window shut
# at 2026-09-24T03:49:30Z — and the commit that added the exemption was authored
# 2026-09-24T03:56:34Z, seven minutes later. It was copied from `civitai-app-requests`
# without re-reading the clock. Removed rather than left as a no-op that would
# misstate which packages this repo exempts.
#
# The lesson, if a future `@civitai/*` bump ever does trip the gate: check the
# publish timestamp first (`npm view <pkg> time`). The wait is hours, not days, and
# an exemption written after the window has already closed is dead config on arrival.
# CLAUDE.md covers the case where one is genuinely needed.
