# nginx config for the block app.
# Served under /generate-from-model/ to match block.manifest.json's iframe.src.

server {
  listen 8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Health check (kubelet probe)
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Serve the block bundle. Vite uses absolute asset paths by default which
  # would break under /generate-from-model/; the build is configured with
  # `base: '/generate-from-model/'` (see vite.config.ts).
  location /generate-from-model/ {
    try_files $uri $uri/ /generate-from-model/index.html;

    # No XFO header — civitai.com must be able to iframe us.
    # Explicit frame-ancestors instead.
    add_header Content-Security-Policy "frame-ancestors https://*.civitaic.com https://civitai.com https://*.civitai.com" always;
    # Reasonable defaults
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bundle has fingerprinted asset names; long-cache them
    location ~* /generate-from-model/assets/.+\.(js|css|woff2?|png|svg)$ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
    }
  }

  # Friendly redirect from root
  location = / {
    return 302 /generate-from-model/;
  }
}
