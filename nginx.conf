# nginx config for the block app.
# Each App Block gets its own subdomain (generate-from-model.civit.ai)
# under W12, so the bundle serves at root — no path prefix, no redirect.

server {
  listen 8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Health check (kubelet probe)
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Serve the SPA. Vite is built with base: '/' so asset URLs resolve at root.
  location / {
    try_files $uri $uri/ /index.html;

    # civitai.com + the per-app subdomain hosts must be able to iframe us.
    # Explicit frame-ancestors instead of X-Frame-Options.
    add_header Content-Security-Policy "frame-ancestors https://*.civitaic.com https://civitai.com https://*.civitai.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Long-cache fingerprinted Vite assets.
  location ~* ^/assets/.+\.(js|css|woff2?|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }
}
